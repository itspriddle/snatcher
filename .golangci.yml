version: "2"

linters:
  enable:
    # Correctness backbone (default set)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Complexity + test discipline
    - cyclop
    - gocritic
    - tparallel
    - testifylint
    - thelper
    - usetesting
    # HTTP / context
    - bodyclose
    - noctx
    # Error handling
    - errorlint
    - nilerr
    # Code quality
    - misspell
    - unconvert
    - unparam
    - wastedassign
    # Security
    - gosec
    # Context / duration
    - contextcheck
    - durationcheck
    # Naming / completeness
    - errname
    - predeclared

  settings:
    cyclop:
      max-complexity: 25
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    errorlint:
      asserts: false
      comparison: false
    gosec:
      excludes:
        - G104   # covered by errcheck
        - G115   # int overflow conversion — standard pattern
        - G204   # subprocess w/ variable — expected in CLI tools
        - G304   # file path from input — common in CLI tools
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -SA1019  # handle deprecations separately
        - -ST1000  # package comments low-value for internal CLI
    testifylint:
      disable:
        - float-compare

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - cyclop
          - bodyclose
          - unparam
      - path: _test\.go
        linters:
          - errcheck
        text: "Error return value is not checked"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
